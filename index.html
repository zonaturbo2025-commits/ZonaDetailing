<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Detailing | Car Detailing a Domicilio Roma</title>
    <!-- Font e Icone FontAwesome per i loghi WhatsApp e Instagram -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-color: #ffffff;
            --accent-green: #a6f700; /* Verde brillante del logo */
            --accent-green-hover: #8ce000;
            --border-color: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* BARRA DI NAVIGAZIONE */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5%;
            z-index: 1000;
        }

        .nav-logo img {
            height: 45px;
            width: auto;
            display: block;
            transition: transform 0.2s;
        }

        .nav-logo img:hover {
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-green);
        }

        /* HERO SECTION */
        .hero {
            padding: 160px 20px 80px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #182600 0%, var(--bg-color) 70%);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .hero h1 span {
            color: var(--accent-green);
        }

        .hero p {
            font-size: 1.2rem;
            color: #cccccc;
            max-width: 700px;
            margin: 0 auto 35px auto;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-whatsapp {
            background-color: var(--accent-green);
            color: #000000;
        }

        .btn-whatsapp:hover {
            background-color: var(--accent-green-hover);
            transform: translateY(-2px);
        }

        .btn-instagram {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
        }

        .btn-instagram:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            transform: translateY(-2px);
        }

        /* CONTENITORE SEZIONI */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .section-title {
            font-size: 2.2rem;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background-color: var(--accent-green);
            margin: 10px auto 0 auto;
        }

        /* CHI SIAMO */
        .about-text {
            text-align: center;
            font-size: 1.1rem;
            color: #bbbbbb;
            max-width: 850px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* SERVIZI */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .service-card {
            background-color: var(--card-bg);
            padding: 30px 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: border-color 0.3s, transform 0.3s;
        }

        .service-card:hover {
            border-color: var(--accent-green);
            transform: translateY(-5px);
        }

        .service-card h3 {
            color: var(--accent-green);
            margin-bottom: 12px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .service-card p {
            color: #aaaaaa;
            font-size: 0.95rem;
        }

        /* DIMOSTRAZIONI VIDEO (INSTAGRAM EMBED) */
        .video-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .instagram-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            max-width: 400px;
            width: 100%;
            text-align: center;
