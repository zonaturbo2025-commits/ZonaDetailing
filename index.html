<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Detailing | Car Detailing a Domicilio Roma</title>
    <!-- Icone FontAwesome per WhatsApp e Instagram -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-color: #ffffff;
            --accent-green: #a6f700; /* Verde brillante del logo */
            --accent-green-hover: #8ce000;
            --border-color: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* BARRA DI NAVIGAZIONE */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5%;
            z-index: 1000;
            animation: fadeInDown 0.8s ease-out;
        }

        /* TASTO HOME STILIZZATO ZD */
        .nav-home-badge {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 5px 12px;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: -1px;
            transition: all 0.3s ease;
        }

        .nav-home-badge:hover {
            border-color: var(--accent-green);
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(166, 247, 0, 0.3);
        }

        .nav-home-badge .z-letter {
            color: #ffffff;
        }

        .nav-home-badge .d-letter {
            color: var(--accent-green);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 22px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-green);
        }

        /* HERO SECTION CON ANIMAZIONE LOGO ZOOM-OUT */
        .hero {
            padding: 150px 20px 80px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #182600 0%, var(--bg-color) 70%);
        }

        .hero-logo {
            max-width: 380px;
            width: 85%;
            height: auto;
            margin: 0 auto 25px auto;
            display: block;
            filter: drop-shadow(0px 0px 25px rgba(166, 247, 0, 0.3));
            animation: logoZoomOut 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes logoZoomOut {
            0% {
                opacity: 0;
                transform: scale(1.4);
                filter: drop-shadow(0px 0px 45px rgba(166, 247, 0, 0.8));
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0px 0px 25px rgba(166, 247, 0, 0.3));
            }
        }

        .hero-logo:hover {
            transform: scale(1.04);
            transition: transform 0.3s ease;
        }

        .hero p {
            font-size: 1.2rem;
            color: #cccccc;
            max-width: 700px;
            margin: 0 auto 35px auto;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-whatsapp {
            background-color: var(--accent-green);
            color: #000000;
            box-shadow: 0 4px 15px rgba(166, 247, 0, 0.2);
        }

        .btn-whatsapp:hover {
            background-color: var(--accent-green-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(166, 247, 0, 0.4);
        }

        .btn-instagram {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
        }

        .btn-instagram:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(166, 247, 0, 0.15);
        }

        /* CONTENITORE SEZIONI */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .section-title {
            font-size: 2.2rem;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
            position: relative;
        }

        .section-title span {
            color: var(--accent-green);
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background-color: var(--accent-green);
            margin: 10px auto 0 auto;
        }

        /* CHI SIAMO */
        .about-text {
            text-align: center;
            font-size: 1.1rem;
            color: #bbbbbb;
            max-width: 850px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* SERVIZI */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .service-card {
            background-color: var(--card-bg);
            padding: 30px 25px;
